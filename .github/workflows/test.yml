name: Verify reproducibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: market-brief-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install live calendar dependency
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -c "import pandas_market_calendars"
      - name: Test collector and trading calendars
        run: python -m unittest discover -s tests -v
      - name: Verify deterministic offline replay
        run: python scripts/reproduce.py
