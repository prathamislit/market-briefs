name: Publish market briefs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - requirements.txt
      - .python-version
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to generate
        type: choice
        default: both
        options: [both, india, us]
  schedule:
    - cron: "15 8 * * 1-5"
      timezone: Asia/Kolkata
    - cron: "15 8 * * 1-5"
      timezone: America/New_York

permissions:
  contents: read

# All editions share their report manifest and deployment target.
concurrency:
  group: market-brief-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      pages: read
    outputs:
      changed: ${{ steps.reports.outputs.changed }}
      collection_failed: ${{ steps.generate.outputs.collection_failed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Queued runs must include reports committed by previous publishers.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install live calendar dependency
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -c "import pandas_market_calendars"
      - name: Test collector and trading calendars
        run: python -m unittest discover -s tests -v
      - name: Verify deterministic offline replay
        run: python scripts/reproduce.py
      - name: Generate editions
        id: generate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EDITION: ${{ inputs.edition || 'both' }}
        shell: bash
        run: |
          flags=()
          # Source pushes bootstrap both editions; docs-only bot pushes do not match.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            flags+=(--force)
          fi
          result=0
          for edition in india us; do
            if [[ "$EDITION" == both || "$EDITION" == "$edition" ]]; then
              python src/build_briefs.py --edition "$edition" "${flags[@]}" || result=1
            fi
          done
          echo "collection_failed=$result" >> "$GITHUB_OUTPUT"
          if [[ "$result" == 1 ]]; then
            echo "::warning::An edition failed collection. Available editions and explicit source diagnostics will publish; the collection-health job will fail."
          fi
      - name: Commit available reports and source diagnostics
        id: reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update market briefs"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages
        if: steps.reports.outputs.changed == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload published files
        if: steps.reports.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  collection-health:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && needs.build.outputs.collection_failed == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Report collection outage
        run: |
          echo "::error::An edition failed collection. Inspect collector logs and published source diagnostics. Successful editions were not blocked."
          exit 1
